[package]
name = "spectra"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "OSINT toolkit for Brazilian public-record sources"
license = "MIT"
repository = "https://github.com/masterazul/spectra"
readme = "README.md"
keywords = ["osint", "brasil", "cnpj", "recon", "cti"]
categories = ["command-line-utilities"]

[[bin]]
name = "spectra"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["native-tls", "json", "gzip"] }
native-tls = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
